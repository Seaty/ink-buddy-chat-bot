<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800"><rect width="1720" height="800" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#18334B} .field{font-size:20px} .label{font-size:17px;fill:#087F83}</style><polyline points="330,100 375,100" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="330" y="61" width="58" height="22" fill="white"/><text class="label" x="333" y="78">1 : N</text><path d="M 363 92 L 375 100 L 363 108" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="525,195 525,275" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="532" y="221" width="58" height="22" fill="white"/><text class="label" x="535" y="238">1 : N</text><path d="M 517 263 L 525 275 L 533 263" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="375,155 350,155 350,350 330,350" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="332" y="221" width="58" height="22" fill="white"/><text class="label" x="335" y="238">1 : N</text><path d="M 342 342 L 330 350 L 342 358" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="375,170 340,170 340,600 330,600" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="242" y="483" width="88" height="22" fill="white"/><text class="label" x="245" y="500">0..1 : N</text><path d="M 342 592 L 330 600 L 342 608" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="525,445 525,525" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="532" y="470" width="68" height="22" fill="white"/><text class="label" x="535" y="487">1 : N*</text><path d="M 517 513 L 525 525 L 533 513" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="675,75 720,75" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="676" y="205" width="148" height="22" fill="white"/><text class="label" x="679" y="222">0..1 : N claim</text><path d="M 708 67 L 720 75 L 708 83" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="870,195 870,275" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="877" y="221" width="88" height="22" fill="white"/><text class="label" x="880" y="238">0..1 : N</text><path d="M 862 263 L 870 275 L 878 263" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="675,150 695,150 695,340 720,340" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="594" y="242" width="88" height="22" fill="white"/><text class="label" x="597" y="259">0..1 : N</text><path d="M 708 332 L 720 340 L 708 348" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="870,445 870,525" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="877" y="471" width="58" height="22" fill="white"/><text class="label" x="880" y="488">1 : N</text><path d="M 862 513 L 870 525 L 878 513" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="1020,620 1065,620" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="1019" y="483" width="88" height="22" fill="white"/><text class="label" x="1022" y="500">N : 0..1</text><path d="M 1053 612 L 1065 620 L 1053 628" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="1020,140 1038,140 1038,505 1205,505 1205,525" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="1087" y="476" width="88" height="22" fill="white"/><text class="label" x="1090" y="493">0..1 : N</text><path d="M 1197 513 L 1205 525 L 1213 513" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="1215,195 1215,275" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="1222" y="221" width="58" height="22" fill="white"/><text class="label" x="1225" y="238">1 : N</text><path d="M 1207 263 L 1215 275 L 1223 263" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="1365,160 1387,160 1387,250 1560,250 1560,275" fill="none" stroke="#087F83" stroke-width="2.5" /><rect x="1442" y="222" width="58" height="22" fill="white"/><text class="label" x="1445" y="239">1 : N</text><path d="M 1552 263 L 1560 275 L 1568 263" fill="none" stroke="#087F83" stroke-width="2"/><polyline points="1365,90 1410,90" fill="none" stroke="#087F83" stroke-width="2.5" stroke-dasharray="7 5" /><rect x="1365" y="56" width="38" height="22" fill="white"/><text class="label" x="1368" y="73">SKU</text><rect x="30" y="25" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M30 65H330" stroke="#18334B" stroke-width="1.5"/><text x="42" y="52" font-size="23" font-weight="bold">roles</text><text class="field" style="font-size:20px" x="42" y="95">PK id : uuid</text><text class="field" style="font-size:20px" x="42" y="125">UK name</text><rect x="375" y="25" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M375 65H675" stroke="#18334B" stroke-width="1.5"/><text x="387" y="52" font-size="23" font-weight="bold">users</text><text class="field" style="font-size:20px" x="387" y="95">PK id : uuid</text><text class="field" style="font-size:20px" x="387" y="125">FK role_id → roles</text><text class="field" style="font-size:20px" x="387" y="155">UK email</text><rect x="720" y="25" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M720 65H1020" stroke="#18334B" stroke-width="1.5"/><text x="732" y="52" font-size="23" font-weight="bold">guest_sessions</text><text class="field" style="font-size:20px" x="732" y="95">PK id : uuid</text><text class="field" style="font-size:18px" x="732" y="125">FK claimed_by_user_id → users</text><text class="field" style="font-size:18px" x="732" y="155">image_uploads_used / expires_at</text><rect x="1065" y="25" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M1065 65H1365" stroke="#18334B" stroke-width="1.5"/><text x="1077" y="52" font-size="23" font-weight="bold">products</text><text class="field" style="font-size:20px" x="1077" y="95">PK id : uuid</text><text class="field" style="font-size:18px" x="1077" y="125">sku / name / price / currency</text><rect x="1410" y="25" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M1410 65H1710" stroke="#18334B" stroke-width="1.5"/><text x="1422" y="52" font-size="21" font-weight="bold">product_image_embeddings</text><text class="field" style="font-size:20px" x="1422" y="95">PK id : serial</text><text class="field" style="font-size:20px" x="1422" y="125">sku (logical link)</text><text class="field" style="font-size:20px" x="1422" y="155">embedding : vector(2048)</text><rect x="30" y="275" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M30 315H330" stroke="#18334B" stroke-width="1.5"/><text x="42" y="302" font-size="23" font-weight="bold">password_reset_tokens</text><text class="field" style="font-size:20px" x="42" y="345">PK id : uuid</text><text class="field" style="font-size:20px" x="42" y="375">FK user_id → users</text><text class="field" style="font-size:20px" x="42" y="405">UK token_hash</text><rect x="375" y="275" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M375 315H675" stroke="#18334B" stroke-width="1.5"/><text x="387" y="302" font-size="23" font-weight="bold">auth_sessions</text><text class="field" style="font-size:20px" x="387" y="345">PK id : uuid</text><text class="field" style="font-size:20px" x="387" y="375">FK user_id → users</text><text class="field" style="font-size:20px" x="387" y="405">expires_at / revoked_at</text><rect x="720" y="275" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M720 315H1020" stroke="#18334B" stroke-width="1.5"/><text x="732" y="302" font-size="23" font-weight="bold">chat_sessions</text><text class="field" style="font-size:20px" x="732" y="345">PK id : uuid</text><text class="field" style="font-size:18px" x="732" y="375">FK user_id → users (nullable)</text><text class="field" style="font-size:18px" x="732" y="405">FK guest_session_id (nullable)</text><rect x="1065" y="275" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M1065 315H1365" stroke="#18334B" stroke-width="1.5"/><text x="1077" y="302" font-size="23" font-weight="bold">product_images</text><text class="field" style="font-size:20px" x="1077" y="345">PK id : uuid</text><text class="field" style="font-size:20px" x="1077" y="375">FK product_id → products</text><text class="field" style="font-size:20px" x="1077" y="405">storage_key</text><rect x="1410" y="275" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M1410 315H1710" stroke="#18334B" stroke-width="1.5"/><text x="1422" y="302" font-size="23" font-weight="bold">product_embeddings</text><text class="field" style="font-size:20px" x="1422" y="345">PK id : uuid</text><text class="field" style="font-size:20px" x="1422" y="375">FK product_id → products</text><text class="field" style="font-size:20px" x="1422" y="405">embedding : vector(1024)</text><rect x="30" y="525" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M30 565H330" stroke="#18334B" stroke-width="1.5"/><text x="42" y="552" font-size="23" font-weight="bold">audit_logs</text><text class="field" style="font-size:20px" x="42" y="595">PK id : uuid</text><text class="field" style="font-size:20px" x="42" y="625">FK actor_user_id → users</text><text class="field" style="font-size:20px" x="42" y="655">action / resource_id</text><rect x="375" y="525" width="300" height="170" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M375 565H675" stroke="#18334B" stroke-width="1.5"/><text x="387" y="552" font-size="23" font-weight="bold">refresh_tokens</text><text class="field" style="font-size:20px" x="387" y="595">PK id : uuid</text><text class="field" style="font-size:20px" x="387" y="625">FK (session_id, user_id)*</text><text class="field" style="font-size:18px" x="387" y="655">FK user_id / replaced_by_id**</text><rect x="720" y="525" width="300" height="185" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M720 565H1020" stroke="#18334B" stroke-width="1.5"/><text x="732" y="552" font-size="23" font-weight="bold">chat_messages</text><text class="field" style="font-size:20px" x="732" y="595">PK id : uuid</text><text class="field" style="font-size:18px" x="732" y="625">FK session_id → chat_sessions</text><text class="field" style="font-size:20px" x="732" y="655">FK image_id → image_uploads</text><text class="field" style="font-size:16px" x="732" y="685">sequence_number / client_request_id</text><rect x="1065" y="525" width="300" height="185" rx="5" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><path d="M1065 565H1365" stroke="#18334B" stroke-width="1.5"/><text x="1077" y="552" font-size="23" font-weight="bold">image_uploads</text><text class="field" style="font-size:20px" x="1077" y="595">PK id : uuid</text><text class="field" style="font-size:18px" x="1077" y="625">FK user_id → users (nullable)</text><text class="field" style="font-size:18px" x="1077" y="655">FK guest_session_id (nullable)</text><text class="field" style="font-size:20px" x="1077" y="685">storage_key / analysis</text><text x="30" y="748" font-size="20">PK = Primary Key • FK = Foreign Key • N = many • dashed = logical SKU link (no FK)</text><text x="30" y="779" font-size="18">Owner XOR: user_id OR guest_session_id • * composite FK → auth_sessions(id,user_id) • ** replaced_by_id → refresh_tokens</text></svg>