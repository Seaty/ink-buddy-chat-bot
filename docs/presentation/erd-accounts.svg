<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800"><rect width="1720" height="800" fill="white"/><style>text{font-family:Tahoma,Arial,sans-serif;fill:#18334B}</style><polyline points="405,160 445,160" fill="none" stroke="#07858A" stroke-width="3" /><text x="408" y="140" font-size="22" fill="#07858A">1:N</text><path d="M430 150 L445 160 L430 170" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="640,295 640,430" fill="none" stroke="#07858A" stroke-width="3" /><text x="655" y="365" font-size="22" fill="#07858A">1 : 0..N</text><path d="M630 415 L640 430 L650 415" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="445,270 420,270 420,390 210,390 210,430" fill="none" stroke="#07858A" stroke-width="3" /><text x="30" y="375" font-size="22" fill="#07858A">1 : 0..N</text><path d="M200 415 L210 430 L220 415" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="835,150 875,150" fill="none" stroke="#07858A" stroke-width="3" /><text x="830" y="330" font-size="22" fill="#07858A">claim</text><path d="M860 140 L875 150 L860 160" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="835,575 875,575" fill="none" stroke="#07858A" stroke-width="3" /><text x="825" y="410" font-size="22" fill="#07858A">1:N*</text><path d="M860 565 L875 575 L860 585" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="640,25 640,5 1500,5 1500,25" fill="none" stroke="#07858A" stroke-width="3" /><text x="1305" y="330" font-size="22" fill="#07858A">actor: 0..1 user</text><path d="M1490 10 L1500 25 L1510 10" fill="none" stroke="#07858A" stroke-width="3"/><rect x="15" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="15" y="25" width="390" height="55" fill="#18334B"/><text x="32" y="61" style="fill:white" font-size="26" font-weight="bold">roles</text><text x="32" y="115" font-size="23" style="fill:#087F83">กำหนดสิทธิ์ User / Admin</text><path d="M30 133H390" stroke="#D4E1E6"/><text x="32" y="168" font-size="25">PK id : uuid</text><text x="32" y="203" font-size="25">UK name</text><rect x="445" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="445" y="25" width="390" height="55" fill="#18334B"/><text x="462" y="61" style="fill:white" font-size="26" font-weight="bold">users</text><text x="462" y="115" font-size="23" style="fill:#087F83">บัญชีและรหัสผ่านผู้ใช้</text><path d="M460 133H820" stroke="#D4E1E6"/><text x="462" y="168" font-size="25">PK id : uuid</text><text x="462" y="203" font-size="25">FK role_id → roles</text><text x="462" y="238" font-size="25">email / password_hash</text><rect x="875" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="875" y="25" width="390" height="55" fill="#18334B"/><text x="892" y="61" style="fill:white" font-size="26" font-weight="bold">guest_sessions</text><text x="892" y="115" font-size="23" style="fill:#087F83">Guest token อายุและโควตารูป</text><path d="M890 133H1250" stroke="#D4E1E6"/><text x="892" y="168" font-size="25">PK id : uuid</text><text x="892" y="203" font-size="25">FK claimed_by_user_id → users</text><text x="892" y="238" font-size="21">expires_at / image_uploads_used</text><rect x="1305" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="1305" y="25" width="390" height="55" fill="#18334B"/><text x="1322" y="61" style="fill:white" font-size="26" font-weight="bold">audit_logs</text><text x="1322" y="115" font-size="23" style="fill:#087F83">บันทึกกิจกรรมของระบบ</text><path d="M1320 133H1680" stroke="#D4E1E6"/><text x="1322" y="168" font-size="25">PK id : uuid</text><text x="1322" y="203" font-size="25">FK actor_user_id → users</text><text x="1322" y="238" font-size="25">action / resource_id</text><rect x="15" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="15" y="430" width="390" height="55" fill="#18334B"/><text x="32" y="466" style="fill:white" font-size="26" font-weight="bold">password_reset_tokens</text><text x="32" y="520" font-size="23" style="fill:#087F83">token สำหรับเปลี่ยนรหัสผ่าน</text><path d="M30 538H390" stroke="#D4E1E6"/><text x="32" y="573" font-size="25">PK id : uuid</text><text x="32" y="608" font-size="25">FK user_id → users</text><text x="32" y="643" font-size="25">UK token_hash / expires_at</text><rect x="445" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="445" y="430" width="390" height="55" fill="#18334B"/><text x="462" y="466" style="fill:white" font-size="26" font-weight="bold">auth_sessions</text><text x="462" y="520" font-size="23" style="fill:#087F83">Login session เพื่อ revoke ทันที</text><path d="M460 538H820" stroke="#D4E1E6"/><text x="462" y="573" font-size="25">PK id : uuid</text><text x="462" y="608" font-size="25">FK user_id → users</text><text x="462" y="643" font-size="25">expires_at / revoked_at</text><rect x="875" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="875" y="430" width="390" height="55" fill="#18334B"/><text x="892" y="466" style="fill:white" font-size="26" font-weight="bold">refresh_tokens</text><text x="892" y="520" font-size="23" style="fill:#087F83">refresh rotation เก็บเฉพาะ hash</text><path d="M890 538H1250" stroke="#D4E1E6"/><text x="892" y="573" font-size="25">PK id : uuid</text><text x="892" y="608" font-size="25">FK (session_id, user_id)*</text><text x="892" y="643" font-size="25">FK user_id / replaced_by_id**</text><text x="15" y="747" font-size="22">PK = Primary Key • FK = Foreign Key • 1 : 0..N = หนึ่งรายการสัมพันธ์กับศูนย์หรือหลายรายการ</text><text x="15" y="780" font-size="22">* composite FK → auth_sessions(id,user_id) • ** replaced_by_id → refresh_tokens • UUID ใหม่ใช้ UUIDv7</text></svg>