<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800"><rect width="1720" height="800" fill="white"/><style>text{font-family:Tahoma,Arial,sans-serif;fill:#18334B}</style><polyline points="210,295 210,430" fill="none" stroke="#07858A" stroke-width="3" /><text x="225" y="365" font-size="22" fill="#07858A">1 : 0..N</text><path d="M200 415 L210 430 L220 415" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="405,270 420,270 420,390 640,390 640,430" fill="none" stroke="#07858A" stroke-width="3" /><text x="450" y="375" font-size="22" fill="#07858A">1 : 0..N</text><path d="M630 415 L640 430 L650 415" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="405,150 445,150" fill="none" stroke="#07858A" stroke-width="3" stroke-dasharray="9 7"/><text x="398" y="330" font-size="22" fill="#07858A">SKU link</text><polyline points="1070,295 1070,430" fill="none" stroke="#07858A" stroke-width="3" /><text x="1085" y="365" font-size="22" fill="#07858A">1 : 0..N</text><path d="M1060 415 L1070 430 L1080 415" fill="none" stroke="#07858A" stroke-width="3"/><polyline points="1500,295 1500,565 1265,565" fill="none" stroke="#07858A" stroke-width="3" /><text x="1310" y="410" font-size="22" fill="#07858A">0..1 image : N messages</text><path d="M1280 555 L1265 565 L1280 575" fill="none" stroke="#07858A" stroke-width="3"/><rect x="15" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="15" y="25" width="390" height="55" fill="#18334B"/><text x="32" y="61" style="fill:white" font-size="26" font-weight="bold">products</text><text x="32" y="115" font-size="23" style="fill:#087F83">ข้อมูลสินค้าและแหล่งอ้างอิง</text><path d="M30 133H390" stroke="#D4E1E6"/><text x="32" y="168" font-size="25">PK id : uuid</text><text x="32" y="203" font-size="25">sku / name / category</text><text x="32" y="238" font-size="25">price / currency / source_ref</text><rect x="445" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="445" y="25" width="390" height="55" fill="#18334B"/><text x="462" y="61" style="fill:white" font-size="24" font-weight="bold">product_image_embeddings</text><text x="462" y="115" font-size="23" style="fill:#087F83">เวกเตอร์ภาพสำหรับค้นสินค้า</text><path d="M460 133H820" stroke="#D4E1E6"/><text x="462" y="168" font-size="25">PK id : serial</text><text x="462" y="203" font-size="25">sku — logical link, no FK</text><text x="462" y="238" font-size="25">embedding : vector(2048)</text><rect x="875" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="875" y="25" width="390" height="55" fill="#18334B"/><text x="892" y="61" style="fill:white" font-size="26" font-weight="bold">chat_sessions</text><text x="892" y="115" font-size="23" style="fill:#087F83">หัวข้อแชตและเจ้าของ</text><path d="M890 133H1250" stroke="#D4E1E6"/><text x="892" y="168" font-size="25">PK id : uuid</text><text x="892" y="203" font-size="25">FK user_id / guest_session_id</text><text x="892" y="238" font-size="25">title / deleted_at</text><rect x="1305" y="25" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="1305" y="25" width="390" height="55" fill="#18334B"/><text x="1322" y="61" style="fill:white" font-size="26" font-weight="bold">image_uploads</text><text x="1322" y="115" font-size="23" style="fill:#087F83">รูปที่ผู้ใช้แนบและผลวิเคราะห์</text><path d="M1320 133H1680" stroke="#D4E1E6"/><text x="1322" y="168" font-size="25">PK id : uuid</text><text x="1322" y="203" font-size="25">FK user_id / guest_session_id</text><text x="1322" y="238" font-size="25">storage_key / analysis</text><rect x="15" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="15" y="430" width="390" height="55" fill="#18334B"/><text x="32" y="466" style="fill:white" font-size="26" font-weight="bold">product_images</text><text x="32" y="520" font-size="23" style="fill:#087F83">รูปภาพของสินค้าใน catalog</text><path d="M30 538H390" stroke="#D4E1E6"/><text x="32" y="573" font-size="25">PK id : uuid</text><text x="32" y="608" font-size="25">FK product_id → products</text><text x="32" y="643" font-size="25">storage_key / is_primary</text><rect x="445" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="445" y="430" width="390" height="55" fill="#18334B"/><text x="462" y="466" style="fill:white" font-size="26" font-weight="bold">product_embeddings</text><text x="462" y="520" font-size="23" style="fill:#087F83">schema เวกเตอร์ข้อความ (แผน RAG)</text><path d="M460 538H820" stroke="#D4E1E6"/><text x="462" y="573" font-size="25">PK id : uuid</text><text x="462" y="608" font-size="25">FK product_id → products</text><text x="462" y="643" font-size="25">embedding : vector(1024)</text><rect x="875" y="430" width="390" height="270" rx="4" fill="#F8FBFC" stroke="#18334B" stroke-width="2"/><rect x="875" y="430" width="390" height="55" fill="#18334B"/><text x="892" y="466" style="fill:white" font-size="26" font-weight="bold">chat_messages</text><text x="892" y="520" font-size="23" style="fill:#087F83">ข้อความและอ้างอิงสินค้า</text><path d="M890 538H1250" stroke="#D4E1E6"/><text x="892" y="573" font-size="25">PK id : uuid</text><text x="892" y="608" font-size="25">FK session_id / image_id</text><text x="892" y="643" font-size="25">sequence_number / request ID</text><text x="15" y="747" font-size="22">Owner XOR: user_id หรือ guest_session_id อย่างใดอย่างหนึ่ง (อ้างอิง users / guest_sessions ในหน้าก่อน)</text><text x="15" y="780" font-size="22">เส้นประ SKU ไม่ใช่ FK • image_id เป็น nullable • product_refs เป็น JSON snapshot ไม่ใช่ FK ไป products</text></svg>